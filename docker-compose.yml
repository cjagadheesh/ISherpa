services:
  backend:
    image: jagadheesh1/sebi-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      # Must include whatever origin the browser actually loads the frontend
      # from — localhost works for local dev, but a cloud host (EC2, etc.)
      # needs its public DNS/IP added here, e.g.
      # CORS_ORIGINS=http://ec2-x-x-x-x.compute.amazonaws.com:5173 in your
      # root .env. The default below only covers local dev.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_API_KEY_2: ${GROQ_API_KEY_2:-}
      GROQ_API_KEY_3: ${GROQ_API_KEY_3:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434/v1}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-}
      BLOCKCHAIN_PRIVATE_KEY: ${BLOCKCHAIN_PRIVATE_KEY:-}
      BLOCKCHAIN_CONTRACT_ADDRESS: ${BLOCKCHAIN_CONTRACT_ADDRESS:-}
      BLOCKCHAIN_MAX_RETRIES: ${BLOCKCHAIN_MAX_RETRIES:-1}
      BLOCKCHAIN_RETRY_BACKOFF_SECONDS: ${BLOCKCHAIN_RETRY_BACKOFF_SECONDS:-2}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
    volumes:
      # Named volume, not a bind mount to the repo — keeps model downloads
      # (PaddleOCR/sentence-transformers) cached across `docker compose down`
      # without touching host files or fighting the image's own /root/.cache.
      - backend-model-cache:/root/.cache
      - backend-paddlex-cache:/root/.paddlex
      # Without these, every `docker compose down && up` silently wiped the
      # demo user's entire in-progress session — main.py's load_session/
      # save_session fall back to this local file whenever Supabase env vars
      # are unset (the zero-config default this compose file advertises).
      # Mounted onto individual paths (not the whole /app) so the app's own
      # source code still comes from the image, not a stale host bind mount.
      # backend-session-state targets the state/ directory, not the
      # session_state.json file directly — mounting a named volume onto a
      # single file failed with a runc "mount directory onto a file" error
      # even on a freshly created volume (some Docker builds don't reliably
      # auto-detect the target should be file-typed), so main.py now keeps
      # session_state.json inside this directory instead.
      - backend-session-state:/app/state
      - backend-uploads:/app/temp_uploads
      - backend-audit-log:/app/audit
      - backend-chroma-db:/app/chroma_db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  frontend:
    image: jagadheesh1/sebi-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the JS bundle at build time (Vite reads this at `build`,
        # not container start) — must be whatever address the *browser* can
        # reach the backend at, not an address that's only valid inside the
        # Compose network or on the host machine itself. localhost:8000 only
        # works when the browser and the containers are on the same machine;
        # on a cloud host (EC2, etc.) this must be that host's public DNS/IP,
        # e.g. VITE_API_URL=http://ec2-x-x-x-x.compute.amazonaws.com:8000 in
        # your root .env — and changing it requires `docker compose up
        # --build` (a plain restart won't re-bake the JS bundle).
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-model-cache:
  backend-paddlex-cache:
  backend-session-state:
  backend-uploads:
  backend-audit-log:
  backend-chroma-db:
